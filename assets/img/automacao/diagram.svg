<svg viewBox="0 0 860 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pipeline de scraping: FastAPI recebe requisição, Playwright navega no portal público, retorna JSON estruturado">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#3a3f4d"/>
    </marker>
    <marker id="ar-b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#4f8ef7"/>
    </marker>
    <style>
      text { font-family: 'Courier New', Courier, monospace; }
    </style>
  </defs>

  <!-- BG -->
  <rect width="860" height="240" fill="#0b0c0e"/>

  <!-- ── CLIENTE ────────────────────────────────────────────────── -->
  <rect x="12" y="88" width="80" height="64" rx="5" fill="#141519" stroke="#22252d" stroke-width="1"/>
  <text x="52" y="113" text-anchor="middle" font-size="10" fill="#e8eaf0">CLIENTE</text>
  <text x="52" y="129" text-anchor="middle" font-size="8" fill="#8892a4">POST /buscar</text>
  <text x="52" y="143" text-anchor="middle" font-size="8" fill="#4f8ef7">JSON payload</text>

  <line x1="92" y1="120" x2="118" y2="120" stroke="#3a3f4d" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- ── NGINX ───────────────────────────────────────────────────── -->
  <rect x="122" y="96" width="95" height="48" rx="5" fill="#15192b" stroke="#2a3a5c" stroke-width="1"/>
  <text x="169" y="116" text-anchor="middle" font-size="10" fill="#4f8ef7">NGINX</text>
  <text x="169" y="131" text-anchor="middle" font-size="8" fill="#8892a4">proxy_read_timeout</text>
  <text x="169" y="141" text-anchor="middle" font-size="8" fill="#4f8ef7">300s</text>

  <line x1="217" y1="120" x2="243" y2="120" stroke="#3a3f4d" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- ── FASTAPI ─────────────────────────────────────────────────── -->
  <rect x="247" y="72" width="155" height="96" rx="5" fill="#141519" stroke="#22252d" stroke-width="1"/>
  <text x="324" y="96" text-anchor="middle" font-size="11" fill="#e8eaf0">FastAPI</text>
  <line x1="261" y1="104" x2="388" y2="104" stroke="#22252d" stroke-width="0.5"/>
  <text x="324" y="121" text-anchor="middle" font-size="9" fill="#8892a4">SearchRequest</text>
  <text x="324" y="135" text-anchor="middle" font-size="8" fill="#4f8ef7">Pydantic · valida entrada</text>
  <text x="324" y="150" text-anchor="middle" font-size="8" fill="#8892a4">Swagger UI gerado auto</text>
  <text x="324" y="162" text-anchor="middle" font-size="8" fill="#8892a4">async handler</text>

  <line x1="402" y1="120" x2="428" y2="120" stroke="#3a3f4d" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- ── PLAYWRIGHT (async) ─────────────────────────────────────── -->
  <rect x="432" y="46" width="170" height="148" rx="5" fill="#0f1015" stroke="#22252d" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="517" y="64" text-anchor="middle" font-size="8" fill="#3a3f4d">Playwright async · Docker + Chromium</text>

  <!-- try -->
  <rect x="444" y="70" width="146" height="48" rx="4" fill="#141519" stroke="#22252d" stroke-width="1"/>
  <text x="517" y="90" text-anchor="middle" font-size="10" fill="#e8eaf0">try</text>
  <text x="517" y="105" text-anchor="middle" font-size="8" fill="#8892a4">navega · extrai · timeout 90s</text>

  <line x1="517" y1="118" x2="517" y2="130" stroke="#3a3f4d" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- except -->
  <rect x="444" y="132" width="146" height="30" rx="4" fill="#1a0f0f" stroke="#7f1d1d" stroke-width="1"/>
  <text x="517" y="152" text-anchor="middle" font-size="9" fill="#ef4444">except → erro estruturado</text>

  <!-- finally -->
  <rect x="444" y="170" width="146" height="18" rx="4" fill="#0f1a0f" stroke="#14532d" stroke-width="1"/>
  <text x="517" y="183" text-anchor="middle" font-size="9" fill="#22c55e">finally → fecha browser</text>

  <!-- Playwright → Portal -->
  <line x1="602" y1="104" x2="648" y2="104" stroke="#3a3f4d" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="625" y="96" text-anchor="middle" font-size="8" fill="#8892a4">HTTPS</text>

  <!-- ── PORTAL PÚBLICO ─────────────────────────────────────────── -->
  <rect x="652" y="72" width="148" height="96" rx="5" fill="#141519" stroke="#22252d" stroke-width="1"/>
  <text x="726" y="96" text-anchor="middle" font-size="10" fill="#e8eaf0">Portal Público</text>
  <line x1="666" y1="104" x2="786" y2="104" stroke="#22252d" stroke-width="0.5"/>
  <text x="726" y="121" text-anchor="middle" font-size="9" fill="#8892a4">domcontentloaded</text>
  <text x="726" y="135" text-anchor="middle" font-size="8" fill="#8892a4">(não networkidle)</text>
  <text x="726" y="150" text-anchor="middle" font-size="8" fill="#8892a4">WAF · latência variável</text>
  <text x="726" y="162" text-anchor="middle" font-size="8" fill="#3a3f4d">EC2 IP → inspeção extra</text>

  <!-- Portal → Playwright (return) -->
  <path d="M 800 112 Q 826 112 826 84 Q 826 55 800 55 L 604 55 Q 578 55 578 80" fill="none" stroke="#3a3f4d" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ar)"/>
  <text x="714" y="48" text-anchor="middle" font-size="8" fill="#8892a4">HTML · DOM</text>

  <!-- FastAPI → cliente (return JSON) -->
  <path d="M 324 168 Q 324 200 185 200 Q 52 200 52 168" fill="none" stroke="#4f8ef7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ar-b)"/>
  <text x="188" y="212" text-anchor="middle" font-size="8" fill="#4f8ef7">SearchResult · JSON estruturado</text>

  <!-- footer -->
  <text x="430" y="232" text-anchor="middle" font-size="8" fill="#22252d">AUTOMAÇÃO E WEB SCRAPING · pipeline de requisição</text>
</svg>
