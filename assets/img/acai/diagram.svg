<svg viewBox="0 0 860 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gestão de Açaí: pipeline CI/CD e fluxo de backup diário">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#3a3f4d"/>
    </marker>
    <marker id="ar-g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#22c55e"/>
    </marker>
    <marker id="ar-r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#ef4444"/>
    </marker>
    <style>
      text { font-family: 'Courier New', Courier, monospace; }
    </style>
  </defs>

  <!-- BG -->
  <rect width="860" height="310" fill="#0b0c0e"/>

  <!-- ── SECTION: CI/CD PIPELINE ─────────────────────────────── -->
  <text x="430" y="20" text-anchor="middle" font-size="9" fill="#3a3f4d">── CI/CD PIPELINE ──────────────────────────────────────────────────────────</text>

  <!-- git push -->
  <rect x="14" y="38" width="74" height="54" rx="5" fill="#141519" stroke="#22252d" stroke-width="1"/>
  <text x="51" y="60" text-anchor="middle" font-size="10" fill="#e8eaf0">git push</text>
  <text x="51" y="76" text-anchor="middle" font-size="8" fill="#8892a4">main</text>
  <text x="51" y="88" text-anchor="middle" font-size="8" fill="#4f8ef7">↑ trigger</text>

  <!-- arrow git → GH Actions -->
  <line x1="88" y1="65" x2="112" y2="65" stroke="#3a3f4d" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- GitHub Actions container -->
  <rect x="114" y="26" width="465" height="80" rx="5" fill="#0f1015" stroke="#22252d" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="346" y="40" text-anchor="middle" font-size="8" fill="#3a3f4d">GitHub Actions</text>

  <!-- Ruff -->
  <rect x="124" y="44" width="90" height="54" rx="4" fill="#141519" stroke="#22252d" stroke-width="1"/>
  <text x="169" y="67" text-anchor="middle" font-size="10" fill="#e8eaf0">Ruff</text>
  <text x="169" y="82" text-anchor="middle" font-size="8" fill="#8892a4">lint</text>
  <text x="169" y="93" text-anchor="middle" font-size="8" fill="#8892a4">format check</text>

  <line x1="214" y1="71" x2="234" y2="71" stroke="#3a3f4d" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- pytest + PG -->
  <rect x="236" y="44" width="128" height="54" rx="4" fill="#141519" stroke="#22252d" stroke-width="1"/>
  <text x="300" y="67" text-anchor="middle" font-size="10" fill="#e8eaf0">pytest</text>
  <text x="300" y="82" text-anchor="middle" font-size="8" fill="#8892a4">~296 testes</text>
  <text x="300" y="93" text-anchor="middle" font-size="8" fill="#4f8ef7">PostgreSQL real</text>

  <line x1="364" y1="71" x2="384" y2="71" stroke="#3a3f4d" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Coverage Gate -->
  <rect x="386" y="44" width="125" height="54" rx="4" fill="#141519" stroke="#22252d" stroke-width="1"/>
  <text x="448" y="64" text-anchor="middle" font-size="10" fill="#e8eaf0">coverage</text>
  <text x="448" y="79" text-anchor="middle" font-size="10" fill="#e8eaf0">gate</text>
  <text x="448" y="93" text-anchor="middle" font-size="9" fill="#4f8ef7">≥ 80%</text>

  <!-- success arrow (right) -->
  <line x1="579" y1="65" x2="607" y2="65" stroke="#22c55e" stroke-width="1.5" marker-end="url(#ar-g)"/>
  <text x="593" y="57" text-anchor="middle" font-size="8" fill="#22c55e">✓</text>

  <!-- fail arrow (down) -->
  <line x1="448" y1="98" x2="448" y2="120" stroke="#ef4444" stroke-width="1.5" marker-end="url(#ar-r)"/>
  <text x="474" y="115" font-size="8" fill="#ef4444">✗ falha</text>
  <rect x="388" y="122" width="125" height="30" rx="4" fill="#1a0f0f" stroke="#7f1d1d" stroke-width="1"/>
  <text x="450" y="142" text-anchor="middle" font-size="9" fill="#ef4444">build bloqueado</text>

  <!-- Deploy Hook -->
  <rect x="609" y="44" width="115" height="54" rx="4" fill="#141519" stroke="#22252d" stroke-width="1"/>
  <text x="666" y="67" text-anchor="middle" font-size="10" fill="#e8eaf0">Deploy Hook</text>
  <text x="666" y="82" text-anchor="middle" font-size="8" fill="#8892a4">Render API</text>
  <text x="666" y="93" text-anchor="middle" font-size="8" fill="#4f8ef7">autoDeploy: false</text>

  <line x1="724" y1="71" x2="750" y2="71" stroke="#22c55e" stroke-width="1.5" marker-end="url(#ar-g)"/>

  <!-- Render -->
  <rect x="752" y="44" width="90" height="54" rx="4" fill="#141519" stroke="#22c55e" stroke-width="1"/>
  <text x="797" y="67" text-anchor="middle" font-size="10" fill="#22c55e">RENDER</text>
  <text x="797" y="82" text-anchor="middle" font-size="8" fill="#8892a4">produção</text>
  <text x="797" y="93" text-anchor="middle" font-size="8" fill="#22c55e">● online</text>

  <!-- divider -->
  <line x1="30" y1="170" x2="830" y2="170" stroke="#22252d" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- ── SECTION: BACKUP DIÁRIO ──────────────────────────────── -->
  <text x="430" y="185" text-anchor="middle" font-size="9" fill="#3a3f4d">── BACKUP DIÁRIO · cron 03:00 UTC ──────────────────────────────────────</text>

  <!-- Steps y center = 235 -->

  <!-- cron -->
  <rect x="14" y="198" width="82" height="56" rx="4" fill="#141519" stroke="#22252d" stroke-width="1"/>
  <text x="55" y="221" text-anchor="middle" font-size="10" fill="#e8eaf0">cron</text>
  <text x="55" y="236" text-anchor="middle" font-size="8" fill="#8892a4">03:00 UTC</text>
  <text x="55" y="248" text-anchor="middle" font-size="8" fill="#4f8ef7">GH Actions</text>
  <line x1="96" y1="226" x2="116" y2="226" stroke="#3a3f4d" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- pg_dump -->
  <rect x="118" y="198" width="88" height="56" rx="4" fill="#141519" stroke="#22252d" stroke-width="1"/>
  <text x="162" y="221" text-anchor="middle" font-size="10" fill="#e8eaf0">pg_dump</text>
  <text x="162" y="235" text-anchor="middle" font-size="8" fill="#8892a4">endpoint direto</text>
  <text x="162" y="248" text-anchor="middle" font-size="8" fill="#8892a4">sem pooler</text>
  <line x1="206" y1="226" x2="226" y2="226" stroke="#3a3f4d" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- gzip -->
  <rect x="228" y="198" width="72" height="56" rx="4" fill="#141519" stroke="#22252d" stroke-width="1"/>
  <text x="264" y="224" text-anchor="middle" font-size="10" fill="#e8eaf0">gzip</text>
  <text x="264" y="240" text-anchor="middle" font-size="8" fill="#8892a4">compressão</text>
  <line x1="300" y1="226" x2="320" y2="226" stroke="#3a3f4d" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- validate -->
  <rect x="322" y="198" width="90" height="56" rx="4" fill="#141519" stroke="#22252d" stroke-width="1"/>
  <text x="367" y="221" text-anchor="middle" font-size="10" fill="#e8eaf0">validate</text>
  <text x="367" y="235" text-anchor="middle" font-size="8" fill="#8892a4">tamanho mín.</text>
  <text x="367" y="248" text-anchor="middle" font-size="8" fill="#4f8ef7">falha → abort</text>
  <line x1="412" y1="226" x2="432" y2="226" stroke="#3a3f4d" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- rclone -->
  <rect x="434" y="198" width="80" height="56" rx="4" fill="#141519" stroke="#22252d" stroke-width="1"/>
  <text x="474" y="221" text-anchor="middle" font-size="10" fill="#e8eaf0">rclone</text>
  <text x="474" y="235" text-anchor="middle" font-size="8" fill="#8892a4">upload</text>
  <text x="474" y="248" text-anchor="middle" font-size="8" fill="#8892a4">→ Drive</text>
  <line x1="514" y1="226" x2="534" y2="226" stroke="#3a3f4d" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- validate upload -->
  <rect x="536" y="198" width="90" height="56" rx="4" fill="#141519" stroke="#22252d" stroke-width="1"/>
  <text x="581" y="218" text-anchor="middle" font-size="10" fill="#e8eaf0">validate</text>
  <text x="581" y="232" text-anchor="middle" font-size="10" fill="#e8eaf0">upload</text>
  <text x="581" y="248" text-anchor="middle" font-size="8" fill="#4f8ef7">confirma no Drive</text>
  <line x1="626" y1="226" x2="646" y2="226" stroke="#3a3f4d" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Google Drive -->
  <rect x="648" y="198" width="90" height="56" rx="4" fill="#141519" stroke="#22252d" stroke-width="1"/>
  <text x="693" y="221" text-anchor="middle" font-size="10" fill="#e8eaf0">Google</text>
  <text x="693" y="235" text-anchor="middle" font-size="10" fill="#e8eaf0">Drive</text>
  <line x1="738" y1="226" x2="758" y2="226" stroke="#3a3f4d" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- rotate -->
  <rect x="760" y="198" width="86" height="56" rx="4" fill="#141519" stroke="#22252d" stroke-width="1"/>
  <text x="803" y="221" text-anchor="middle" font-size="10" fill="#e8eaf0">rotate</text>
  <text x="803" y="235" text-anchor="middle" font-size="8" fill="#8892a4">mantém os 15</text>
  <text x="803" y="248" text-anchor="middle" font-size="8" fill="#4f8ef7">mais recentes</text>

  <!-- runner label -->
  <text x="430" y="282" text-anchor="middle" font-size="8" fill="#2a2f3d">runner efêmero — nenhum artefato persiste após execução</text>

  <!-- footer -->
  <text x="430" y="300" text-anchor="middle" font-size="8" fill="#22252d">GESTÃO DE AÇAÍ · CI/CD pipeline + backup diário</text>
</svg>
